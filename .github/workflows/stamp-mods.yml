name: Stamp finished mods

on:
  push:
    branches: [main]
    paths: ['dist/index.html']

permissions:
  contents: write

jobs:
  stamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Date any mod that just moved to Done
        run: node scripts/stamp-mods.mjs

      - name: Commit if anything was stamped
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add dist/index.html
          if git diff --cached --quiet; then
            echo "Nothing to stamp."
          else
            git commit -m "Garage log: date finished mods"
            git push
          fi
