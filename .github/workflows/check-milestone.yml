name: Check follower milestone

on:
  schedule:
    - cron: '23 */3 * * *'   # every 3 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check Twitch follower count
        run: node scripts/check-milestone.mjs

      - name: Commit if a milestone was reached
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add dist/milestones.json
          if git diff --cached --quiet; then
            echo "No new milestone."
          else
            git commit -m "Follower milestone reached"
            git push
          fi
