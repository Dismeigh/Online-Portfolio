<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Project status | Denizen Technologies</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#14110f">
  <meta name="color-scheme" content="dark">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Special+Elite&family=Work+Sans:wght@400;600;800&display=swap">
  <link rel="stylesheet" href="/styles.css?v=135">
</head>
<body class="client-page">
  <div class="fixed-bg" aria-hidden="true"></div>
  <main class="client-wrap">
    <p class="client-brand"><a href="/work/">Denizen Technologies</a></p>
    <section class="client-card" id="card" aria-live="polite">
      <p class="client-kicker">Project status</p>
      <h1 class="client-title" id="title">Loading&hellip;</h1>
      <p class="client-sub" id="sub"></p>
      <ol class="client-steps" id="steps" hidden></ol>
      <p class="client-due" id="due" hidden></p>
      <div class="client-note" id="note" hidden></div>
      <div class="client-needs" id="needs" hidden>
        <h2 class="client-h2">What I need from you</h2>
        <p class="client-needs-sub" id="needs-sub"></p>
        <ul class="client-needs-list" id="needs-list"></ul>
        <p class="client-needs-msg" id="needs-msg" role="status"></p>
      </div>
      <div class="client-docs" id="docs" hidden></div>
      <div class="client-review" id="review" hidden>
        <h2 class="client-h2" id="rv-h">How did it go?</h2>
        <p class="client-review-thanks" id="rv-thanks" hidden></p>
        <form id="rv-form" novalidate>
          <fieldset class="rv-stars"><legend>Your rating</legend>
            <span class="rv-row"><label><input type="radio" name="rating" value="5" checked><span>5 stars</span></label><label><input type="radio" name="rating" value="4"><span>4 stars</span></label><label><input type="radio" name="rating" value="3"><span>3 stars</span></label><label><input type="radio" name="rating" value="2"><span>2 stars</span></label><label><input type="radio" name="rating" value="1"><span>1 star</span></label></span>
          </fieldset>
          <label for="rv-text">A sentence or two about working together</label><textarea id="rv-text" rows="4" maxlength="600"></textarea>
          <label for="rv-name">Name to show with it <span>(like &ldquo;Alex&rdquo; or &ldquo;Alex, Bluebird Bakery&rdquo;)</span></label><input id="rv-name" maxlength="40" autocomplete="name">
          <label class="rv-consent"><input type="checkbox" id="rv-consent"> <span>OK to show this review (with that name) on denizen-dismeigh.com</span></label>
          <button type="submit" class="social-btn" id="rv-send">Send review</button>
          <p class="client-review-msg" id="rv-msg" role="alert"></p>
        </form>
      </div>
      <p class="client-updated" id="updated"></p>
    </section>
    <p class="client-foot">Questions? <a href="mailto:denizen.dismeigh@gmail.com">denizen.dismeigh@gmail.com</a>. This page is private: only people with this link can see it.</p>
  </main>
  <script>
  (() => {
    const $ = id => document.getElementById(id);
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const STEPS = [['quote', 'Quote'], ['booked', 'Booked'], ['deposit', 'Deposit paid'], ['progress', 'In progress'], ['done', 'Done']];
    const code = new URLSearchParams(location.search).get('s') || '';
    history.replaceState(null, '', location.pathname + '?s=' + encodeURIComponent(code)); // keep only the code
    fetch('/api/job?s=' + encodeURIComponent(code), { cache: 'no-store' }).then(r => r.json()).then(d => {
      if (d.error) { $('title').textContent = 'Link not active'; $('sub').textContent = d.error; return; }
      $('title').textContent = d.client;
      $('sub').textContent = d.service || '';
      const at = STEPS.findIndex(s => s[0] === d.stage);
      $('steps').innerHTML = STEPS.map(([k, name], i) => `<li class="${i < at ? 'is-done' : i === at ? 'is-now' : ''}"><span>${name}</span></li>`).join('');
      $('steps').hidden = false;
      if (d.due) { $('due').textContent = `${d.stage === 'done' ? 'Finished' : 'Expected'}: ${new Date(d.due + 'T12:00:00').toLocaleDateString([], { weekday: 'short', month: 'long', day: 'numeric', year: 'numeric' })}`; $('due').hidden = false; }
      if (d.note) { $('note').textContent = d.note; $('note').hidden = false; }
      // What I need from you: tick each one once it's sent (Dismeigh gets a heads-up)
      const needs = d.needs || [];
      const drawNeeds = list => {
        const left = list.filter(n => !n.done).length;
        $('needs-sub').textContent = left ? `Tick each one once you\u2019ve sent it. ${left} left.` : 'All sent. Thank you!';
        $('needs-list').replaceChildren(...list.map((n, i) => {
          const li = document.createElement('li'), lab = document.createElement('label'), cb = document.createElement('input'), sp = document.createElement('span');
          cb.type = 'checkbox'; cb.checked = n.done; cb.dataset.i = i; sp.textContent = n.t; lab.append(cb, sp); li.append(lab); if (n.done) li.className = 'is-done'; return li;
        }));
      };
      if (needs.length && d.stage !== 'done') {
        drawNeeds(needs); $('needs').hidden = false;
        $('needs-list').addEventListener('change', async e => {
          const cb = e.target.closest('input[data-i]'); if (!cb) return;
          cb.disabled = true;
          try {
            const r = await fetch('/api/job', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ need: true, s: code, i: Number(cb.dataset.i), done: cb.checked }) });
            const x = await r.json();
            if (r.ok) { drawNeeds(x.needs); $('needs-msg').textContent = cb.checked ? 'Got it. Dismeigh will see it\u2019s on the way.' : ''; }
            else { cb.checked = !cb.checked; cb.disabled = false; $('needs-msg').textContent = x.error || 'Couldn\u2019t save that. Try again.'; }
          } catch { cb.checked = !cb.checked; cb.disabled = false; $('needs-msg').textContent = 'Couldn\u2019t save that. Check your connection.'; }
        });
      }
      const usd = c => (c / 100).toLocaleString('en-US', { style: 'currency', currency: 'USD' });
      const docs = [];
      if (d.agreement) docs.push(`<div class="client-doc"><div><p class="client-kicker">Agreement</p><b>${d.agreement.signed ? `Signed by ${esc(d.agreement.signed.name)}` : 'Waiting for your signature'}</b></div><a class="social-btn" href="/agree/?a=${encodeURIComponent(d.agreement.code)}">${d.agreement.signed ? 'View' : 'Read &amp; sign'}</a></div>`);
      if (d.invoice) {
        const due = d.invoice.status === 'paid' ? 'Paid in full' : d.invoice.status === 'deposit' ? `Deposit received, ${usd(d.invoice.total - Math.round(d.invoice.total * d.invoice.deposit / 100))} left` : d.invoice.deposit ? `Deposit due: ${usd(Math.round(d.invoice.total * d.invoice.deposit / 100))}` : `Due: ${usd(d.invoice.total)}`;
        docs.push(`<div class="client-doc"><div><p class="client-kicker">Invoice ${esc(d.invoice.number)}</p><b>${usd(d.invoice.total)}</b> <span>${esc(due)}</span></div><span class="client-doc-btns"><a class="social-btn" href="/invoice/?i=${encodeURIComponent(d.invoice.code)}">View</a>${d.invoice.payLink ? `<a class="social-btn client-pay" href="${esc(d.invoice.payLink)}" target="_blank" rel="noopener noreferrer">${esc(d.invoice.payLabel || 'Pay now')}</a>` : ''}</span></div>`);
      }
      if (docs.length) { $('docs').innerHTML = `<h2 class="client-h2">Your documents</h2>${docs.join('')}`; $('docs').hidden = false; }
      // Review (once the project is done)
      if (d.review && d.review.open) {
        const r = d.review.mine;
        if (r) {
          $('rv-thanks').textContent = 'Thanks for the review! You can change it below if you like.'; $('rv-thanks').hidden = false; $('rv-h').textContent = 'Your review';
          $('rv-text').value = r.text; $('rv-name').value = r.name; $('rv-consent').checked = true;
          const star = document.querySelector(`[name="rating"][value="${r.rating}"]`); if (star) star.checked = true;
          $('rv-send').textContent = 'Update review';
        }
        $('review').hidden = false;
      }
      $('updated').textContent = `Last updated ${new Date(d.updated).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })}`;
    }).catch(() => { $('title').textContent = 'Couldn’t load'; $('sub').textContent = 'Check your connection and refresh.'; });
    $('rv-form').addEventListener('submit', async e => {
      e.preventDefault(); $('rv-msg').textContent = ''; $('rv-send').disabled = true;
      try {
        const r = await fetch('/api/job', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ review: true, s: code,
          rating: Number(document.querySelector('[name="rating"]:checked')?.value), text: $('rv-text').value, name: $('rv-name').value, consent: $('rv-consent').checked }) });
        const d = await r.json().catch(() => ({}));
        if (!r.ok) { $('rv-msg').textContent = d.error || 'Couldn’t send that. Try again.'; if (d.field) $(d.field)?.focus(); }
        else { $('rv-msg').textContent = 'Thank you! It’ll show on the Work page once Dismeigh has seen it.'; $('rv-msg').classList.add('is-ok'); $('rv-send').textContent = 'Update review'; }
      } catch { $('rv-msg').textContent = 'Couldn’t send that. Check your connection.'; }
      $('rv-send').disabled = false;
    });
  })();
  </script>
</body>
</html>
