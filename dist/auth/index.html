<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Signing in | Dismeigh</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Signing in with Twitch.">
  <meta name="theme-color" content="#14110f">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Special+Elite&family=Work+Sans:wght@400;600;800&display=swap">
  <link rel="stylesheet" href="/styles.css?v=55">
</head>
<body class="subpage">
  <a class="skip-link" href="#content">Skip to content</a>
  <div class="fixed-bg" aria-hidden="true"></div>
  <nav class="site-nav" aria-label="Primary navigation">
    <a href="/" class="nav-brand">Dismeigh</a>
    <a href="/">&larr; Back to the ship</a>
  </nav>
  <main id="content" class="sub-main" tabindex="-1">
    <header class="sub-hero">
      <span class="sub-slab sub-slab-a" aria-hidden="true"></span>
      <p class="sub-kicker">Docking</p>
      <h1 class="sub-title">Signing in</h1>
      <p class="sub-intro" id="auth-status" role="status">Checking your Twitch pass&hellip;</p>
    </header>
  </main>
  <footer class="footer">
    <p class="footer-signoff">See you next session.</p>
    <p class="footer-brand">Dismeigh</p>
    <p class="footer-links"><a href="/">Home</a> <span aria-hidden="true">&middot;</span> <a href="/lore/">Channel lore</a> <span aria-hidden="true">&middot;</span> <a href="/rewind/">Rewind</a></p>
  </footer>
  <script src="/app.js?v=39" defer></script>
  <script>
  (async () => {
    const status = document.getElementById('auth-status');
    const hash = new URLSearchParams(location.hash.slice(1));
    const query = new URLSearchParams(location.search);
    history.replaceState(null, '', '/auth/');
    let expected = null, back = '/';
    try { expected = sessionStorage.getItem('dismeigh-auth-state'); back = sessionStorage.getItem('dismeigh-auth-return') || '/'; sessionStorage.removeItem('dismeigh-auth-state'); } catch {}
    if (!back.startsWith('/') || back.startsWith('//')) back = '/';
    if (query.get('error')) { status.textContent = 'Sign-in was cancelled. Nothing was saved.'; return; }
    const token = hash.get('access_token');
    if (!token || !expected || hash.get('state') !== expected) { status.textContent = 'That sign-in link didn\u2019t check out. Head back and try again.'; return; }
    let secrets = [];
    try { secrets = JSON.parse(localStorage.getItem('dismeigh-secrets')) || []; } catch {}
    try {
      const r = await fetch('/api/auth/twitch', { method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin', body: JSON.stringify({ token, secrets }) });
      if (!r.ok) throw new Error();
      const { user } = await r.json();
      try { localStorage.setItem('dismeigh-secrets', JSON.stringify(user.secrets)); } catch {}
      status.textContent = `Welcome aboard, ${user.displayName}. Taking you back\u2026`;
      setTimeout(() => { location.replace(back); }, 900);
    } catch {
      status.textContent = 'Sign-in didn\u2019t go through. Head back and try again in a bit.';
    }
  })();
  </script>
</body>
</html>
