</head>
<body class="subpage">
  <a class="skip-link" href="#content">Skip to content</a>
  <div class="fixed-bg" aria-hidden="true"></div>
  <nav class="site-nav" aria-label="Primary navigation">
    <a href="/" class="nav-brand">Dismeigh</a>
    <a href="/">&larr; Back to the ship</a>
  </nav>
  <main id="content" class="sub-main" tabindex="-1">
    <header class="sub-hero">
      <span class="sub-slab sub-slab-a" aria-hidden="true"></span>
      <span class="sub-slab sub-slab-b" aria-hidden="true"></span>
      <p class="sub-kicker">Case files</p>
      <h1 class="sub-title">Channel Lore</h1>
      <p class="sub-intro">New around here? These are the running jokes and legendary moments chat keeps bringing up.</p>
    </header>

    <div class="lore-tools">
      <label for="lore-search">Search the lore</label>
      <input id="lore-search" type="search" placeholder="Try &ldquo;soap&rdquo; or &ldquo;Phasmophobia&rdquo;" autocomplete="off">
    </div>
    <p class="lore-empty" id="lore-empty" hidden>Nothing in the files matches that yet.</p>
    <div class="lore-grid" id="lore-grid" aria-live="polite"></div>
  </main>
  <footer class="footer">
    <p class="footer-signoff">See you next session.</p>
    <p class="footer-brand">Dismeigh</p>
    <p class="footer-links"><a href="/">Home</a> <span aria-hidden="true">&middot;</span> <a href="/lore/">Channel lore</a> <span aria-hidden="true">&middot;</span> <a href="/rewind/">Rewind</a> <span aria-hidden="true" data-install-sep>&middot;</span> <a class="footer-install" href="/install/" data-install>Get the app</a></p>
  </footer>
  <script src="/app.js?v=33" defer></script>
  <script>
  {
    const grid = document.getElementById('lore-grid');
    const empty = document.getElementById('lore-empty');
    const esc = t => String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    let entries = [];
    const draw = q => {
      const query = q.trim().toLowerCase();
      const list = entries.filter(e => !query || [e.term, e.game, e.what].join(' ').toLowerCase().includes(query));
      grid.innerHTML = list.map((e, i) => `
        <article class="lore-card">
          <p class="lore-num">File ${String(entries.indexOf(e) + 1).padStart(2, '0')}${e.game ? ` &middot; ${esc(e.game)}` : ''}</p>
          <h2>${esc(e.term)}</h2>
          <p>${esc(e.what)}</p>
          ${(e.links || []).filter(l => /^https:\/\//.test(l.url)).map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">${esc(l.label)} &rarr;</a>`).join(' ')}
        </article>`).join('');
      empty.hidden = list.length > 0;
    };
    fetch('/lore.json').then(r => r.json()).then(d => { entries = d.entries || []; draw(''); });
    document.getElementById('lore-search').addEventListener('input', e => draw(e.target.value));
  }
  </script>
</body>
</html>
